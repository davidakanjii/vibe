name: vibesync
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: vibesync
      POSTGRES_DB: vibesync
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U vibesync -d vibesync]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, "yes", --maxmemory-policy, noeviction]
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  migrate:
    build:
      context: .
      dockerfile: infra/backend.Dockerfile
    environment: &backend-env
      DATABASE_URL: postgresql+psycopg://vibesync:${POSTGRES_PASSWORD}@db:5432/vibesync
      REDIS_URL: redis://redis:6379/0
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      LIVEKIT_URL: ${LIVEKIT_URL:-ws://localhost:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-}
    command: [alembic, upgrade, head]
    depends_on:
      db: {condition: service_healthy}
  api:
    build:
      context: .
      dockerfile: infra/backend.Dockerfile
    environment: *backend-env
    ports: [127.0.0.1:8000:8000]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    restart: unless-stopped
  worker:
    build:
      context: .
      dockerfile: infra/backend.Dockerfile
    environment: *backend-env
    command: [rq, worker, --url, redis://redis:6379/0, default]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: infra/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        API_INTERNAL_URL: http://api:8000
    environment:
      API_INTERNAL_URL: http://api:8000
    ports: [127.0.0.1:3000:3000]
    depends_on: [api]
    restart: unless-stopped
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    profiles: [storage]
    command: [server, /data, --console-address, ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    ports: [127.0.0.1:9000:9000, 127.0.0.1:9001:9001]
    volumes: [object-data:/data]
  livekit:
    image: livekit/livekit-server:v1.8.3
    profiles: [audio]
    command: [--dev, --bind, 0.0.0.0]
    ports: [127.0.0.1:7880:7880, 127.0.0.1:7881:7881, 127.0.0.1:7882:7882/udp]
volumes:
  postgres-data:
  redis-data:
  object-data:
